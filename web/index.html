<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predicción semanal de demanda - Online Retail</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.4; }
    h1 { margin-bottom: 6px; }
    .muted { color: #555; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
    input { padding: 10px; font-size: 1rem; }
    button { margin-top: 18px; padding: 11px 18px; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 22px; padding: 16px; border: 1px solid #bbb; border-radius: 8px; min-height: 48px; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Predicción semanal de demanda</h1>
  <p class="muted">CPE Minería de Datos · Online Retail · Random Forest</p>
  <label>URL de la API <input id="apiUrl" value="http://127.0.0.1:8000" /></label>
  <div class="grid">
    <label>Demanda semana anterior <input id="lag1" type="number" min="0" step="any" value="20" /></label>
    <label>Demanda hace dos semanas <input id="lag2" type="number" min="0" step="any" value="18" /></label>
    <label>Promedio últimas 4 semanas <input id="rolling4" type="number" min="0" step="any" value="21" /></label>
    <label>Facturas semana anterior <input id="invoiceLag1" type="number" min="0" step="any" value="5" /></label>
    <label>Número de semana (1-53) <input id="week" type="number" min="1" max="53" value="40" /></label>
  </div>
  <button id="predictBtn">Estimar demanda</button>
  <div id="result">Ingrese los valores y presione “Estimar demanda”.</div>
  <script>
    const byId = (id) => document.getElementById(id);
    byId('predictBtn').addEventListener('click', async () => {
      const result = byId('result');
      result.textContent = 'Consultando modelo...';
      const payload = {
        demand_lag1: Number(byId('lag1').value),
        demand_lag2: Number(byId('lag2').value),
        demand_rolling4: Number(byId('rolling4').value),
        invoice_count_lag1: Number(byId('invoiceLag1').value),
        week_number: Number(byId('week').value)
      };
      try {
        const base = byId('apiUrl').value.replace(/\/$/, '');
        const response = await fetch(`${base}/predict`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'La API devolvió un error.');
        result.innerHTML = `<strong>Demanda estimada:</strong> ${data.predicted_demand_units} unidades<br><span class="muted">${data.interpretation}</span>`;
      } catch (error) { result.textContent = `Error: ${error.message}`; }
    });
  </script>
</body>
</html>
